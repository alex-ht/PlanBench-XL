# Example run config for data collection (Task 3)
run_id: "retail-collect-example-001"
base_config: "src/env/config/base/env.yaml"
model_ref: "openai_gpt54"
domain: "retail"

data:
  task_file: src/data/retail/tasks.json
  query_file: src/data/retail/queries.json
  baseline_tools_file: src/data/retail/baseline_tools.json
  noisy_tools_file: src/data/retail/noisy_tools.json
  blocker_tools_file: src/data/retail/blocker_tools.json
  datatypes_file: src/data/retail/datatypes.json
  database_file: src/data/retail/database.json
  paths_set_catalog_file: src/data/retail/paths_set_catalog.json

# Small sample for quick collection test
query_sample:
  size: 2
  seed: 42

# Data collection settings (Task 3)
data_collection:
  enabled: true
  output_subdir: "collect"
  format: "openai_chat"
  use_native_tools: false
  log_per_turn: true
  log_full_trajectories: true

output:
  output_dir: "retail/collect-test"

runtime:
  max_steps: 5

logging:
  level: "INFO"
  console: true
